name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Siapkan web
        run: |
          mkdir www
          rsync -a --exclude=node_modules --exclude=android --exclude=www --exclude=assets --exclude=.git --exclude=.github --exclude=package.json --exclude=package-lock.json --exclude=capacitor.config.json ./ www/
      - run: python3 make_bg.py
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Versi
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Tanda tangan
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/theo.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          $BT/zipalign -p 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/theo.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias theo --out $GITHUB_WORKSPACE/theo-daily.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: theo-daily-apk
          path: theo-daily.apk
